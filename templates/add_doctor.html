{% extends "base.html" %}
{% block title %}Add Doctor - IITM Hospital{% endblock %}

{% block content %}
<style>
  
  .box { 
    width: 500px; margin: 40px auto; background: #fff; padding: 15px; border: 1px solid #ccc; 
  }
  label { 
    display: block; margin-top: 8px; 
  }
  input {
     width: 100%; margin-top: 3px; margin-bottom: 8px; 
  }
</style>

{% if total_departments == 0 %}
      <p>You have not added any departments , please add from dashboard</p>
{% elif total_departments > 0 %}
<div class="box">
  <h3>Add a Doctor Account</h3>

  <form action="{{url_for('add_doctor')}}" method="post">
    <label for="name">Full name</label>
    <input id="name" name="doctor_name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="contact">Contact</label>
    <input id="contact" name="contact" type="text" placeholder="Phone number" maxlength="10" minlength="10"
    title="Enter a 10-digit phone number" pattern="[0-9]{10}" required>
    <label for="department_id">Department</label>
    <select name="department_id" required>
        {% for dept in departments %}
            <option value="{{ dept.department_id }}">{{ dept.name }}</option>
        {% endfor %}
    </select>
    <label for="specialization">Specialization</label>
    <input id="specialization" name="specialization" type="text" required>

    <label for="about">About</label>
    <textarea id="about" name="about" rows="2" cols="40"></textarea>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" required
    pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,}$"
    title="Password must be at least 8 characters long and contain at least one letter and one number"
    >

    <button type="submit" class="btn btn-success w-100 mt-3">Register</button>
  </form>

</div>
{% endif %}

{% endblock %}
